# exlr8: EXL3-trellis experts (kindlingai/vllm-exlr8 @ a2e163cb05) over the NVFP4
# stack. Stack LAST — these files win over every other overlay's copy of the same
# target (adaptive-k, draft-trunc, recoverssm, sp). The routed experts decode from
# trellis units with the exlr8 MoE kernel; dense linears stay FP8/NVFP4. Expert
# width is a runtime knob: VLLM_EXLR8_WIDTHS = k2 | k3 | k4 | <manifest>.
#
# Per topology (README, "Topologies"):
#   TP=4  MODEL_DIR exlr8-release       VLLM_EXLR8_WIDTHS k4
#   TP=3  MODEL_DIR exlr8-release-tp3   VLLM_EXLR8_WIDTHS k4   (+ tp3.yaml padding)
#   TP=2  MODEL_DIR exlr8-release       VLLM_EXLR8_WIDTHS k3   (64 heads / 2048 inter split by 2)
#   TP=1  MODEL_DIR exlr8-release       VLLM_EXLR8_WIDTHS k2   (~87 GiB, one box)
#
# EXLR8_TREE defaults to this repo's tree/ (the launcher exports it). MODEL_DIR is
# the assembled release (config + tokenizer + symlinks to the k2/k3/k4 experts and
# the shared dense), reachable in the container — mount its parent and point at it.
services:
  glm53:
    volumes:
      # The release's experts/ and dense symlink into this tree, so mount the whole root.
      - ${MODELS_ROOT:-/mnt/nfs/models}:/models/nas:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/quantization/exlr8:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/exlr8:ro
      - ${EXLR8_TREE:-../../tree}/vllm/distributed/device_communicators/arx.py:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arx.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/distributed/device_communicators/arx_vllm.cu:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arx_vllm.cu:ro
      # arx_vllm.cu #includes arx_site.h; mount it too or a cold JIT rebuild fails.
      - ${EXLR8_TREE:-../../tree}/vllm/distributed/device_communicators/arx_site.h:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arx_site.h:ro
      - ${EXLR8_TREE:-../../tree}/vllm/distributed/device_communicators/arxbig.cu:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arxbig.cu:ro
      - ${EXLR8_TREE:-../../tree}/vllm/distributed/device_communicators/cuda_communicator.py:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/cuda_communicator.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/kernels/mhc/tilelang.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/mhc/tilelang.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/kernels/mhc/tilelang_kernels.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/mhc/tilelang_kernels.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/fused_moe/experts/flashinfer_cutlass_moe.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/experts/flashinfer_cutlass_moe.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/fused_moe/megamoe_vllm.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/megamoe_vllm.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/fused_moe/router/grouped_topk_router.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/router/grouped_topk_router.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/mamba/ops/causal_conv1d.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/mamba/ops/causal_conv1d.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/quantization/__init__.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/__init__.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/layers/quantization/modelopt.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/modelopt.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/model_loader/__init__.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/__init__.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/model_loader/base_loader.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/base_loader.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/model_loader/dense_fp8.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/dense_fp8.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/model_loader/exlr8_loader.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/exlr8_loader.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/model_executor/model_loader/weight_snapshot.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/weight_snapshot.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/models/glm5next/common/attention.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/attention.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/models/glm5next/common/kda.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/kda.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/models/glm5next/common/model.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/model.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/models/glm5next/common/recoverssm.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/common/recoverssm.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/attention/backends/gdn_attn.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/gdn_attn.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/attention/backends/mla/gb10_sparse_mla.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/gb10_sparse_mla.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/core/kv_cache_coordinator.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/kv_cache_coordinator.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/core/kv_cache_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/kv_cache_utils.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/core/sched/adaptive_k.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/sched/adaptive_k.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/kv_cache_interface.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_cache_interface.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/model_runner.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/model_runner.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/spec_decode/dflash2/speculator.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/dflash2/speculator.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/spec_decode/draft_trunc.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/draft_trunc.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/spec_decode/speculator.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/speculator.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/gpu/warmup.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/warmup.py:ro
      - ${EXLR8_TREE:-../../tree}/vllm/v1/worker/utils.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/utils.py:ro
    environment:
      - MODEL_DIR=${MODEL_DIR:-/models/nas/glm-5.3-flash/exlr8-release}
      # QUANT is appended by the entrypoint OUTSIDE EXTRA_ARGS, so an overlay
      # that restates EXTRA_ARGS (tp3/tp6/seqcap32/prof) can no longer drop the
      # exlr8 quantization and load-format and silently load bf16.
      - QUANT=${QUANT:-exlr8}
      - EXTRA_ARGS=--scheduler-cls vllm.v1.core.sched.adaptive_k.AdaptiveKScheduler ${PROF_ARGS:-}
      - VLLM_EXLR8_WIDTHS=${VLLM_EXLR8_WIDTHS:-k4}
      - VLLM_WEIGHT_SNAPSHOT_DIR=/root/.cache/weight-snapshots
      - VLLM_WEIGHT_SNAPSHOT_TAG=exlr8-${EXLR8_TAG:-dev}
      - KV_CACHE_MEMORY=${KV_CACHE_MEMORY:-40802189312}
      - LIMIT_MM={"image":0,"video":0}
