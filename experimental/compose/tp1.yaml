# TP=1: one box, the whole model at k2 (~87 GiB of weights). k2 is the only
# width that fits one box; the entrypoint sets the KV pin. A single box also
# needs a distinct MENTAT_GROUP, or it joins an existing glm53 cluster and sits
# as a worker:
#
#   sudo env TP=1 MENTAT_GROUP=glm53-solo \
#     ./glm53f -f experimental/compose/tp1.yaml up -d
#
# Stack it last (after exlr8.yaml). The entrypoint skips the NCCL fabric
# derivation and fabric-check at TP=1, so an uncabled single box is fine.
services:
  glm53:
    environment:
      - TP=${TP:-1}
      - VLLM_EXLR8_WIDTHS=${VLLM_EXLR8_WIDTHS:-k2}
      - MODEL_DIR=${MODEL_DIR:-/models/nas/glm-5.3-flash/exlr8-release}
      # Batch 4096 holds the prefill activation peak: SP shards tokens, so
      # TP=1 at 4096 matches TP=2's peak at 8192.
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-4096}
